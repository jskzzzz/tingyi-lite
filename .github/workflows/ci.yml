name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # The product is Windows-only: the capture helpers are WASAPI/UI Automation based native hosts
    # and the ASR runtimes ship as win-x64 binaries.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runtime payloads are release inputs and are not committed, so the cases that need a real
      # runtime skip themselves and the rest of the suite runs on a clean checkout.
      - run: npm test
      - run: npm run build
